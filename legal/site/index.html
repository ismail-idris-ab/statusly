<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal — Statusly</title>
<meta name="description" content="Legal for the Statusly Android app.">
<style>
  :root { --brand: #0E8F6E; --brand-dark: #0A6E55; --text: #0F1A16; --muted: #5B6B64; --border: #DDE6E1; --surface: #F4F7F5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--text);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
         font-size: 17px; line-height: 1.7; }
  header { background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%); color: #fff; padding: 48px 24px; }
  header .wrap { max-width: 820px; margin: 0 auto; }
  header h1 { margin: 0 0 6px; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
  header p { margin: 0; opacity: .9; font-size: 16px; }
  main { max-width: 820px; margin: 0 auto; padding: 40px 24px 80px; }
  h1, h2, h3 { line-height: 1.3; letter-spacing: -0.01em; }
  main h1 { font-size: 30px; margin: 40px 0 14px; }
  main h2 { font-size: 24px; margin: 40px 0 12px; padding-top: 20px; border-top: 1px solid var(--border); }
  main h2:first-of-type { border-top: none; padding-top: 0; }
  main h3 { font-size: 19px; margin: 28px 0 10px; }
  a { color: var(--brand); }
  table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 15px; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--border); padding: 10px 12px; text-align: left; vertical-align: top; }
  th { background: var(--surface); font-weight: 600; }
  code { background: var(--surface); padding: 2px 6px; border-radius: 4px; font-size: 14px; }
  blockquote { margin: 20px 0; padding: 14px 18px; background: var(--surface);
                border-left: 4px solid var(--brand); border-radius: 6px; }
  blockquote p { margin: 6px 0; }
  hr { border: none; border-top: 1px solid var(--border); margin: 36px 0; }
  ul, ol { padding-left: 22px; }
  li { margin: 6px 0; }
  footer { border-top: 1px solid var(--border); padding: 28px 24px 60px;
            color: var(--muted); font-size: 14px; text-align: center; }
  footer a { margin: 0 10px; }
  @media (max-width: 600px) { body { font-size: 16px; } header { padding: 34px 20px; } header h1 { font-size: 27px; } }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Statusly</h1>
  <p>Legal</p>
</div></header>
<main>
<h2>Legal documents</h2><ul><li><a href="privacy-policy.html">Privacy Policy</a></li><li><a href="terms-of-service.html">Terms of Service</a></li></ul>
</main>
<footer>
  <a href="privacy-policy.html">Privacy Policy</a> ·
  <a href="terms-of-service.html">Terms of Service</a>
  <p>© 2026 Ismail Idris. Statusly is not affiliated with WhatsApp LLC or Meta Platforms, Inc.</p>
</footer>
</body>
</html>
